<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laundry Final Clean A - Enteng</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.page-view.hidden{display:none!important}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:center;z-index:2000;opacity:0;visibility:hidden;transition:.25s;padding:16px}
.modal-overlay.active{opacity:1;visibility:visible}
.modal-card{position:relative;background:#fff;border-radius:18px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:16px}
.modal-close-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.06);cursor:pointer}
.btn-action-top-slot{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:10px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer}
.antrian-sub-card{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:10px;margin-bottom:10px}
#notaPrintCanvasArea{background:#ffffff!important;color:#000000!important;font-family:'Courier New',monospace!important;font-weight:700!important;border:1px solid #000!important;padding:12px}
#multiHpSyncBanner{display:none!important}
</style>
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#f618a9"></head>
<body class="bg-[#fafafa]">
<div id="app" class="min-h-screen max-w-[480px] mx-auto bg-white">
<header class="sticky top-0 z-40 bg-white border-b p-3 flex justify-between items-center"><div id="label-outlet" class="font-bold">Laundry Land</div><button onclick="createBackup()" class="text-xs bg-black text-white px-3 py-1.5 rounded-full">Backup</button></header>
<main class="pb-24 p-3">
<div id="page-home" class="page-view">
<div class="grid grid-cols-3 gap-2 mb-3"><div class="bg-zinc-100 rounded-xl p-2 text-center"><div id="val-antrian" class="font-bold">0</div><div class="text-xs">Antrian</div></div><div class="bg-blue-100 rounded-xl p-2 text-center"><div id="val-proses" class="font-bold">0</div><div class="text-xs">Proses</div></div><div class="bg-green-100 rounded-xl p-2 text-center"><div id="val-siap-ambil" class="font-bold">0</div><div class="text-xs">Siap</div></div></div>
<div id="antrianListContainer"></div>
</div>
<div id="page-laporan" class="page-view hidden"><button onclick="openKasHariIniModal()" class="w-full bg-black text-white rounded-xl py-3 font-bold text-sm">Kas Hari Ini</button><div id="globalOmzetValue" class="text-center font-bold mt-4">Rp 0</div></div>
<div id="page-setting" class="page-view hidden"><button onclick="createBackup()" class="bg-black text-white rounded-full px-4 py-2 text-xs">Download JSON</button></div>
</main>
<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t flex justify-around p-2"><button onclick="showPage('home')">Home</button><button onclick="showPage('laporan')">Laporan</button><button onclick="showPage('setting')">Setting</button></nav>
</div>
<div id="modalBayarNotaOverlay" class="modal-overlay"><div class="modal-card"><div class="font-bold mb-2">Bayar Nota 5 Row</div><div id="bayarNotaTotal" class="font-bold">Rp 0</div><div id="rowDepositoSplit" class="hidden"><div id="bayarNotaDeposito"></div></div><input id="inputBayarTunai" type="number" oninput="hitungKalkulasiPembayaran()" placeholder="Bayar" class="w-full bg-zinc-100 rounded-full px-3 py-2 mt-2"><div class="flex justify-between mt-2 text-xs"><span id="bayarKembalian">Rp 0</span><span id="bayarSisa">Rp 0</span></div><button onclick="eksekusiSimpanPembayaran()" class="w-full bg-black text-white rounded-full py-2 mt-3">Simpan</button><div class="modal-close-btn" onclick="closeModalBayarNota()">x</div></div></div>
<div id="modalPreviewNotaOverlay" class="modal-overlay"><div class="modal-card"><div id="notaPrintCanvasArea"><div id="p_outlet_name" class="text-center font-bold">LAUNDRY LAND</div><div id="strukPreviewContent"></div></div><div class="flex gap-2 mt-3"><button onclick="executePrintFromPreview()" class="flex-1 bg-black text-white rounded-full py-2 text-xs">Print</button><button onclick="executeShareWAText()" class="flex-1 bg-zinc-100 rounded-full py-2 text-xs">WA Text</button><button onclick="executeShareWAPNG()" class="flex-1 bg-green-100 rounded-full py-2 text-xs">WA PNG</button></div><div class="modal-close-btn" onclick="closeModalPreviewNota()">x</div></div></div>
<div id="toast-container" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50"></div>
<script type="module">
import { initApp } from './js/core/app.js';
import './js/modules/ui.js';
import './js/modules/outlet.js';
import './js/modules/pelanggan.js';
import './js/modules/layanan.js';
import './js/modules/antrian.js';
import './js/modules/nota-bayar.js';
import './js/modules/struk.js';
import './js/modules/laporan.js';
import './js/modules/backup.js';
initApp();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").then(()=>console.log("✅ SW applaundry registered")).catch(e=>console.log("SW fail",e))}</script></body></html>
