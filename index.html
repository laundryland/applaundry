<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f618a9">
<title>Laundry Land - Modular v2.5.28 Clean</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.json">
<script src="https://unpkg.com/dexie@4/dist/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
#supabase-loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="supabase-loading">
  <div style="width:40px;height:40px;border:4px solid #f618a9;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div>
  <div style="margin-top:12px;font-weight:800;color:#f618a9">☁️ Sync Supabase First...</div>
  <div style="margin-top:8px;font-size:11px;color:#666">Order: 1.Supabase → 2.LS → 3.IDB</div>
</div>
<div id="app-root"></div>
<script type="module">
import { supa } from './js/supabase.js';
import { StorageManager, purgeLegacyCache, safeLS } from './js/db.js';
import { initHeaderHome } from './js/modules/header-home.js';
import { renderPelangganList } from './js/modules/master-pelanggan.js';
import './js/modules/print-thermal.js';
import './js/modules/wa-share.js';
window.safeLS = safeLS; window.StorageManager = StorageManager; window.supa = supa;

async function init(){
  await purgeLegacyCache();
  const tables = ['outlets','karyawan','pelanggan','layanan','antrian'];
  for(let t of tables){
    try{
      const dataPromise = StorageManager.getData(t);
      const timeoutPromise = new Promise(res => setTimeout(() => res([]), 3000));
      const data = await Promise.race([dataPromise, timeoutPromise]);
      window[t+'Data'] = data || [];
      console.log(`✅ ${t}: ${data.length}`);
    }catch(e){ window[t+'Data'] = []; }
  }
  
  console.log('📥 Fetch original-body.html...');
  const resp = await fetch('./original-body.html');
  if(!resp.ok) throw new Error(`original-body.html ${resp.status} - cek file 914KB ada di root?`);
  const bodyHtml = await resp.text();
  document.getElementById('app-root').innerHTML = bodyHtml;
  console.log(`✅ Body ${bodyHtml.length} chars loaded`);
  
  setTimeout(()=>{
    try{ initHeaderHome(); console.log('✅ header-home'); }catch(e){ console.error(e); }
    try{
      if(document.getElementById('customerListContainer')){
        renderPelangganList('');
        console.log('✅ pelanggan list');
      }
    }catch(e){ console.error(e); }
    
    document.querySelectorAll('.tap-model').forEach(el=>{
      el.style.pointerEvents='auto'; el.style.cursor='pointer'; el.style.touchAction='manipulation';
    });
    
    // FIX: Hapus 2 splash - yang modular + yang original-body
    const splash1 = document.getElementById('supabase-loading');
    if(splash1) splash1.remove();
    
    // Original-body punya splash sendiri #app-splash-wrapper dan #laundry-splash
    const splash2 = document.getElementById('app-splash-wrapper');
    if(splash2){ splash2.style.display='none'; splash2.remove(); console.log('✅ splash original-body removed'); }
    
    const splash3 = document.getElementById('laundry-splash');
    if(splash3){ splash3.style.display='none'; splash3.remove(); }
    
    console.log('✅ DONE - Modular v2.5.28 Clean loaded - dibawah bersih');
  }, 500);
}

init().catch(e => {
  console.error('INIT FAIL', e);
  const appRoot = document.getElementById('app-root');
  if(appRoot) appRoot.innerHTML = `<div style="padding:20px;text-align:center"><h2>❌ ${e.message}</h2><p>Pastikan original-body.html 914KB ada di root</p><p>${e.stack || ''}</p><button onclick="location.reload()" style="padding:10px 20px;background:#f618a9;color:#fff;border:none;border-radius:8px">Reload</button></div>`;
  const s1 = document.getElementById('supabase-loading');
  if(s1) s1.remove();
  const s2 = document.getElementById('app-splash-wrapper');
  if(s2) s2.remove();
  const s3 = document.getElementById('laundry-splash');
  if(s3) s3.remove();
});

// Unregister old SW that caches splash loop
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    });
    // Don't register new SW for now to avoid cache loop, or register clean one
    // navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
