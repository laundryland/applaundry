<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f618a9">
<title>Laundry Land - Modular v2.5.28 Clean</title>
<link rel="stylesheet" href="./css/app.css">
<script src="https://unpkg.com/dexie@4/dist/dexie.min.js"></script>
<style>
#supabase-loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.json">

</head>
<body>
<div id="supabase-loading">
  <div style="width:40px;height:40px;border:4px solid #f618a9;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div>
  <div style="margin-top:12px;font-weight:800;color:#f618a9">☁️ Sync Supabase First...</div>
  <div style="margin-top:8px;font-size:11px;color:#666">Order: 1.Supabase → 2.LS → 3.IDB</div>
</div>

<div id="app-root">Loading...</div>

<script type="module">
import { supa } from './js/supabase.js';
import { StorageManager, purgeLegacyCache, safeLS } from './js/db.js';
import { initHeaderHome } from './js/modules/header-home.js';
import { renderPelangganList } from './js/modules/master-pelanggan.js';

window.safeLS = safeLS;
window.StorageManager = StorageManager;
window.supa = supa;

async function init(){
  await purgeLegacyCache();
  
  // URUTAN 1: Supabase first untuk semua table
  const tables = ['outlets','karyawan','pelanggan','layanan','antrian'];
  for(let t of tables){
    const data = await StorageManager.getData(t);
    window[t+'Data'] = data;
    console.log(`✅ ${t}: ${data.length} (order 1-2-3)`);
  }
  
  // Load body
  const resp = await fetch('./original-body.html');
  const bodyHtml = await resp.text();
  document.getElementById('app-root').innerHTML = bodyHtml;
  
  // Init modules - fix tap
  setTimeout(()=>{
    initHeaderHome();
    if(document.getElementById('customerListContainer')){
      renderPelangganList('');
    }
    document.querySelectorAll('.tap-model').forEach(el=>{
      el.style.pointerEvents='auto';
      el.style.cursor='pointer';
      el.style.touchAction='manipulation';
    });
    document.getElementById('supabase-loading').remove();
    console.log('✅ Modular v2.5.28 Clean - Supabase single, tap fixed');
  }, 500);
}

init();
</script>

</body>
</html>
