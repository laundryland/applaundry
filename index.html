<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f618a9">
<title>Laundry Land - Modular v2.5.28 Clean</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.json">
<script src="https://unpkg.com/dexie@4/dist/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
#supabase-loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="supabase-loading">
  <div style="width:40px;height:40px;border:4px solid #f618a9;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div>
  <div style="margin-top:12px;font-weight:800;color:#f618a9">☁️ Sync Supabase First...</div>
  <div style="margin-top:8px;font-size:11px;color:#666">Order: 1.Supabase → 2.LS → 3.IDB</div>
</div>
<div id="app-root"></div>
<script type="module">
import { supa } from './js/supabase.js';
import { StorageManager, purgeLegacyCache, safeLS } from './js/db.js';
import { initHeaderHome } from './js/modules/header-home.js';
import { renderPelangganList } from './js/modules/master-pelanggan.js';
import './js/modules/print-thermal.js';
import './js/modules/wa-share.js';
window.safeLS = safeLS; window.StorageManager = StorageManager; window.supa = supa;
async function init(){
  await purgeLegacyCache();
  const tables = ['outlets','karyawan','pelanggan','layanan','antrian'];
  for(let t of tables){
    try{
      const dataPromise = StorageManager.getData(t);
      const timeoutPromise = new Promise(res => setTimeout(() => res([]), 5000));
      const data = await Promise.race([dataPromise, timeoutPromise]);
      window[t+'Data'] = data || [];
    }catch(e){ window[t+'Data'] = []; }
  }
  const resp = await fetch('./original-body.html');
  if(!resp.ok) throw new Error(`original-body.html ${resp.status}`);
  const bodyHtml = await resp.text();
  document.getElementById('app-root').innerHTML = bodyHtml;
  setTimeout(()=>{
    initHeaderHome();
    if(document.getElementById('customerListContainer')) renderPelangganList('');
    document.querySelectorAll('.tap-model').forEach(el=>{
      el.style.pointerEvents='auto'; el.style.cursor='pointer'; el.style.touchAction='manipulation';
    });
    document.getElementById('supabase-loading').remove();
  }, 300);
}
init().catch(e => {
  document.getElementById('app-root').innerHTML = `<div style="padding:20px;text-align:center"><h2>❌ ${e.message}</h2><p>Pastikan original-body.html 914KB ada di root</p><button onclick="location.reload()" style="padding:10px 20px;background:#f618a9;color:#fff;border:none;border-radius:8px">Reload</button></div>`;
  document.getElementById('supabase-loading').remove();
});
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
