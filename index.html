<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Force Upload Karyawan Lama ke Supabase</title>
<style>body{font-family:system-ui; padding:20px;} button{padding:12px 20px; font-weight:800; border-radius:8px; border:1px solid #10b981; background:#10b981; color:white; cursor:pointer; margin:5px;} #log{background:#111; color:#0f0; padding:12px; border-radius:8px; font-size:12px; white-space:pre-wrap; margin-top:12px; max-height:400px; overflow:auto;}</style>
</head>
<body>
<h3>🚀 Force Upload Karyawan Lama ke Supabase</h3>
<p>File ini baca localStorage HP kamu dan paksa upload semua karyawan ke Supabase</p>
<button onclick="forceUpload()">📤 UPLOAD SEMUA KARYAWAN SEKARANG</button>
<button onclick="checkSupa()" style="background:#f59e0b;">🔍 CEK ISI SUPABASE</button>
<button onclick="clearLog()">🧹 Clear Log</button>
<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supa = window.supabase.createClient('https://nniecqbfjmmlrtmolnrt.supabase.co','sb_publishable_JNkBb7xwGqYwyL6s11ffdw_DfV9dSPV');
let logEl = document.getElementById('log');
function log(m){ logEl.textContent += m + '\n'; console.log(m); }

function getAllKaryawanLocal(){
  let all = [];
  // V2
  try{ let v2 = JSON.parse(localStorage.getItem('laundryland_v2_karyawan')||'[]'); if(v2.length) all = all.concat(v2); }catch(e){}
  // Old triple key
  try{ let old = JSON.parse(localStorage.getItem('karyawanData')||'[]'); if(old.length) all = all.concat(old); }catch(e){}
  try{ let old2 = JSON.parse(localStorage.getItem('karyawan')||'[]'); if(old2.length) all = all.concat(old2); }catch(e){}
  try{ let old3 = JSON.parse(localStorage.getItem('karyawandata')||'[]'); if(old3.length) all = all.concat(old3); }catch(e){}
  // Dedupe by id
  let map={}; all.forEach(k=>{ if(k && k.id) map[k.id]=k; });
  return Object.values(map);
}

async function forceUpload(){
  log('🔍 Baca karyawan lokal...');
  let data = getAllKaryawanLocal();
  log(`📦 Ditemukan ${data.length} karyawan di localStorage`);
  if(data.length===0){ log('❌ Tidak ada karyawan lokal!'); return; }
  data.forEach((k,i)=>{ log(`${i+1}. ${k.nama} - ${k.level} - ${k.pin||''} - ${k.id}`); });

  log('\n🚀 Mulai upload ke Supabase...');
  for(let k of data){
    // Fix fields
    if(!k.outlet_id && k.outletId) k.outlet_id = k.outletId;
    if(!k.outletId && k.outlet_id) k.outletId = k.outlet_id;
    if(!k.created_at) k.created_at = new Date().toISOString();
    k.updated_at = new Date().toISOString();
    if(!k.is_active) k.is_active = k.isActive || false;
    
    try{
      let { error } = await supa.from('karyawan').upsert(k, {onConflict:'id'});
      if(error){ log(`❌ Gagal ${k.nama}: ${error.message}`); }
      else{ log(`✅ Sukses ${k.nama} (${k.level})`); }
    }catch(e){ log(`❌ Error ${k.nama}: ${e.message}`); }
  }
  log('\n✅ SELESAI! Cek di Supabase Table Editor -> karyawan');
}

async function checkSupa(){
  log('🔍 Cek Supabase karyawan...');
  let { data, error } = await supa.from('karyawan').select('*');
  if(error){ log('❌ Error: '+error.message); return; }
  log(`📊 Supabase ada ${data.length} karyawan:`);
  data.forEach((k,i)=>{ log(`${i+1}. ${k.nama} - ${k.level} - ${k.pin} - ${k.id}`); });
}

function clearLog(){ logEl.textContent=''; }
</script>
</body>
</html>
