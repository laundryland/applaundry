<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f618a9">
<title>Laundry Land - Modular v2.5.28 Clean</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.json">
<script src="https://unpkg.com/dexie@4/dist/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
#supabase-loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
@keyframes spin{to{transform:rotate(360deg)}}
#debug-log{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.9);color:#0f0;font-size:10px;padding:8px;max-height:100px;overflow:auto;z-index:10000;font-family:monospace}
</style>
</head>
<body>
<div id="supabase-loading">
  <div style="width:40px;height:40px;border:4px solid #f618a9;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div>
  <div style="margin-top:12px;font-weight:800;color:#f618a9">☁️ Sync Supabase First...</div>
  <div style="margin-top:8px;font-size:11px;color:#666" id="loading-status">Order: 1.Supabase → 2.LS → 3.IDB</div>
  <div style="margin-top:8px;font-size:10px;color:#999" id="loading-detail">Init...</div>
</div>

<div id="app-root"></div>
<div id="debug-log"></div>

<script type="module">
import { supa } from './js/supabase.js';
import { StorageManager, purgeLegacyCache, safeLS } from './js/db.js';
import { initHeaderHome } from './js/modules/header-home.js';
import { renderPelangganList } from './js/modules/master-pelanggan.js';
import './js/modules/print-thermal.js';
import './js/modules/wa-share.js';

window.safeLS = safeLS;
window.StorageManager = StorageManager;
window.supa = supa;

function log(msg){
  console.log(msg);
  const el = document.getElementById('debug-log');
  const detail = document.getElementById('loading-detail');
  if(el) el.innerHTML += msg + '<br>';
  if(detail) detail.textContent = msg;
}

async function init(){
  try{
    log('1. purgeLegacyCache...');
    await purgeLegacyCache();
    
    log('2. Load Supabase data (with timeout 5s)...');
    const tables = ['outlets','karyawan','pelanggan','layanan','antrian'];
    for(let t of tables){
      try{
        log(`   fetch ${t}...`);
        // Timeout 5 detik per table biar gak hang terus
        const dataPromise = StorageManager.getData(t);
        const timeoutPromise = new Promise(res => setTimeout(() => res([]), 5000));
        const data = await Promise.race([dataPromise, timeoutPromise]);
        window[t+'Data'] = data || [];
        log(`   ✅ ${t}: ${(data||[]).length}`);
      }catch(e){
        log(`   ❌ ${t} fail: ${e.message}, pakai []`);
        window[t+'Data'] = [];
      }
    }
    
    log('3. Fetch original-body.html...');
    try{
      const resp = await fetch('./original-body.html');
      if(!resp.ok) throw new Error(`HTTP ${resp.status} - file gak ada di GitHub?`);
      const bodyHtml = await resp.text();
      log(`   ✅ original-body.html ${bodyHtml.length} chars`);
      document.getElementById('app-root').innerHTML = bodyHtml;
    }catch(e){
      log(`   ❌ original-body.html fail: ${e.message}`);
      document.getElementById('app-root').innerHTML = `<div style="padding:20px;text-align:center">
        <h2>❌ File original-body.html tidak ditemukan</h2>
        <p>${e.message}</p>
        <p>Pastikan file <b>original-body.html</b> (914KB) sudah diupload ke GitHub di root sejajar index.html</p>
        <p>Nama harus kecil semua: <b>original-body.html</b> bukan Original-Body.html</p>
        <button onclick="location.reload()" style="padding:10px 20px;background:#f618a9;color:#fff;border:none;border-radius:8px;margin-top:10px">Reload</button>
      </div>`;
      document.getElementById('supabase-loading').remove();
      return;
    }
    
    log('4. Init modules...');
    setTimeout(()=>{
      try{
        initHeaderHome();
        log('   ✅ header-home');
      }catch(e){ log('   ❌ header-home: '+e.message); }
      
      try{
        if(document.getElementById('customerListContainer')){
          renderPelangganList('');
          log('   ✅ pelanggan list');
        }
      }catch(e){ log('   ❌ pelanggan: '+e.message); }
      
      document.querySelectorAll('.tap-model').forEach(el=>{
        el.style.pointerEvents='auto';
        el.style.cursor='pointer';
        el.style.touchAction='manipulation';
      });
      
      const loadingEl = document.getElementById('supabase-loading');
      if(loadingEl) loadingEl.remove();
      log('✅ DONE - Modular v2.5.28 Clean loaded');
    }, 500);
  }catch(e){
    log('❌ INIT FAIL: '+e.message);
    document.getElementById('loading-status').textContent = 'Error: '+e.message;
  }
}

init();

// SW register
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => log('SW registered '+reg.scope))
      .catch(err => log('SW fail '+err));
  });
}
</script>

</body>
</html>
