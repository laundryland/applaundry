<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f618a9">
<title>Laundry Land - v2.5.28 2ROW BENER</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="manifest" href="./manifest.json">
<script src="https://unpkg.com/dexie@4/dist/dexie.min.js"></script>
</head>
<body>
<div id="app-root">Loading...</div>
<script type="module">
import { supa } from './js/supabase.js';
import { StorageManager } from './js/db.js';
window.supa = supa;
window.supabaseClient = supa;
window.StorageManager = StorageManager;

async function init(){
  const tables = ['outlets','karyawan','pelanggan','layanan','antrian'];
  for(let t of tables){
    try{
      const data = await StorageManager.getData(t);
      window[t+'Data'] = data || [];
      console.log('✅', t, data.length);
    }catch(e){ window[t+'Data'] = []; }
  }
  const resp = await fetch('./original-body.html');
  let bodyHtml = await resp.text();
  document.getElementById('app-root').innerHTML = bodyHtml;
  
  // Load core-functions as global script - ini yang bikin tambah work
  await new Promise((res)=>{
    const el = document.createElement('script');
    el.src = './js/modules/core-functions.js';
    el.onload = ()=>{ console.log('✅ core-functions BENER loaded'); res(); };
    el.onerror = ()=>{ console.error('core fail'); res(); };
    document.body.appendChild(el);
  });
  
  // Init after core loaded
  setTimeout(()=>{
    if(window.initHeaderHome) window.initHeaderHome();
    if(window.renderPelangganList) window.renderPelangganList('');
    document.querySelectorAll('.tap-model').forEach(el=>{ el.style.pointerEvents='auto'; el.style.cursor='pointer'; });
    console.log('✅ DONE - tambah, level, semua BENER');
  }, 500);
}
init();
</script>
</body>
</html>
