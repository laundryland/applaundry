<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f618a9">
<title>Laundry Land - v2.5.28 FINAL PROFESIONAL</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="manifest" href="./manifest.json">
<script src="https://unpkg.com/dexie@4/dist/dexie.min.js"></script>
<style>
#supabase-loading{position:fixed;inset:0;z-index:99999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="supabase-loading">
  <div style="width:40px;height:40px;border:4px solid #f618a9;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div>
  <div style="margin-top:12px;font-weight:800;color:#f618a9">☁️ Sync Anti Hilang...</div>
</div>
<div id="app-root"></div>
<script type="module">
import { supa } from './js/supabase.js';
import { StorageManager } from './js/db.js';
window.supa = supa;
window.supabaseClient = supa;
window.StorageManager = StorageManager;

async function init(){
  const tables = ['outlets','karyawan','pelanggan','layanan','antrian'];
  for(let t of tables){
    try{
      const data = await StorageManager.getData(t);
      window[t+'Data'] = data || [];
      console.log('✅', t, data.length);
    }catch(e){ window[t+'Data']=[]; }
  }
  const resp = await fetch('./original-body.html');
  const bodyHtml = await resp.text();
  document.getElementById('app-root').innerHTML = bodyHtml;
  
  await new Promise(res=>{
    const el=document.createElement('script');
    el.src='./js/modules/core-functions.js';
    el.onload=()=>{ console.log('✅ core FINAL loaded'); res(); };
    el.onerror=()=>{ console.error('core fail'); res(); };
    document.body.appendChild(el);
  });
  
  setTimeout(()=>{
    try{ if(window.initHeaderHome) initHeaderHome(); }catch(e){}
    try{ if(window.renderPelangganList) renderPelangganList(''); }catch(e){}
    document.getElementById('supabase-loading')?.remove();
    document.getElementById('app-splash-wrapper')?.remove();
    console.log('✅ DONE FINAL PROFESIONAL');
  }, 600);
}
init().catch(e=>{
  console.error(e);
  document.getElementById('app-root').innerHTML = `<div style="padding:20px"><h2>❌ ${e.message}</h2><button onclick="location.reload()">Reload</button></div>`;
  document.getElementById('supabase-loading')?.remove();
});
</script>
</body>
</html>
