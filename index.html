<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f618a9">
<title>Laundry Land - Modular v2.5.28 Clean</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.json">
<script src="https://unpkg.com/dexie@4/dist/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
#supabase-loading{position:fixed;inset:0;z-index:99999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="supabase-loading">
  <div style="width:40px;height:40px;border:4px solid #f618a9;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div>
  <div style="margin-top:12px;font-weight:800;color:#f618a9">☁️ Sync Supabase First...</div>
  <div style="margin-top:8px;font-size:11px;color:#666">Order: 1.Supabase → 2.LS → 3.IDB</div>
</div>
<div id="app-root"></div>
<script type="module">
import { supa } from './js/supabase.js';
import { StorageManager, purgeLegacyCache, safeLS } from './js/db.js';
import { initHeaderHome } from './js/modules/header-home.js';
import { renderPelangganList } from './js/modules/master-pelanggan.js';
import './js/modules/core-functions.js';
import './js/modules/print-thermal.js';
import './js/modules/wa-share.js';
window.safeLS = safeLS; window.StorageManager = StorageManager; window.supa = supa;

async function init(){
  await purgeLegacyCache();
  const tables = ['outlets','karyawan','pelanggan','layanan','antrian'];
  for(let t of tables){
    try{
      const dataPromise = StorageManager.getData(t);
      const timeoutPromise = new Promise(res => setTimeout(() => res([]), 3000));
      const data = await Promise.race([dataPromise, timeoutPromise]);
      window[t+'Data'] = data || [];
      console.log(`✅ ${t}: ${data.length}`);
    }catch(e){ window[t+'Data'] = []; }
  }
  
  console.log('📥 Fetch original-body.html...');
  const resp = await fetch('./original-body.html');
  if(!resp.ok) throw new Error(`original-body.html ${resp.status}`);
  let bodyHtml = await resp.text();
  
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = bodyHtml;
  const scripts = [];
  const scriptEls = tempDiv.querySelectorAll('script');
  scriptEls.forEach(s => {
    if(s.src){ scripts.push({src: s.src, content: ''}); }
    else { scripts.push({src: null, content: s.textContent}); }
    s.remove();
  });
  
  document.getElementById('app-root').innerHTML = tempDiv.innerHTML;
  console.log(`✅ Body ${tempDiv.innerHTML.length} chars, ${scripts.length} scripts`);
  
  for(let i=0; i<scripts.length; i++){
    const s = scripts[i];
    try{
      if(s.src){
        await new Promise((res) => {
          const el = document.createElement('script');
          el.src = s.src; el.onload = res; el.onerror = res;
          document.body.appendChild(el);
        });
      } else if(s.content && s.content.trim().length > 10){
        const el = document.createElement('script');
        el.textContent = s.content;
        document.body.appendChild(el);
      }
    }catch(e){ console.warn('Script fail', i, e); }
  }
  console.log('✅ All original-body scripts executed');
  
  setTimeout(()=>{
    try{ initHeaderHome(); console.log('✅ header-home modular'); }catch(e){ console.error(e); }
    try{
      if(document.getElementById('customerListContainer')){
        renderPelangganList('');
        console.log('✅ pelanggan list modular - deposito 2row');
      }
    }catch(e){ console.error(e); }
    
    document.querySelectorAll('.tap-model').forEach(el=>{
      el.style.pointerEvents='auto'; el.style.cursor='pointer'; el.style.touchAction='manipulation'; el.style.userSelect='none';
    });
    document.querySelectorAll('#header-row1-karyawan-card, #header-row2-outlet-card, #headerOutletDropdown, .customer-card-item, .footer-nav, .btn-tambah').forEach(el=>{
      if(el) el.style.pointerEvents='auto';
    });
    
    const splash1 = document.getElementById('supabase-loading');
    if(splash1) splash1.remove();
    const splash2 = document.getElementById('app-splash-wrapper');
    if(splash2){ splash2.style.display='none'; splash2.remove(); console.log('✅ splash app-splash-wrapper removed'); }
    const splash3 = document.getElementById('laundry-splash');
    if(splash3){ splash3.style.display='none'; splash3.remove(); }
    
    document.body.style.pointerEvents='auto';
    document.body.style.overflow='auto';
    const appRoot = document.getElementById('app-root');
    if(appRoot){ appRoot.style.pointerEvents='auto'; }
    
    console.log('✅ DONE - All buttons clickable - tap-model fixed - 147 handlers');
  }, 800);
}

init().catch(e => {
  console.error('INIT FAIL', e);
  const appRoot = document.getElementById('app-root');
  if(appRoot) appRoot.innerHTML = `<div style="padding:20px;text-align:center"><h2>❌ ${e.message}</h2><p>${e.stack||''}</p><button onclick="location.reload()" style="padding:10px 20px;background:#f618a9;color:#fff;border:none;border-radius:8px">Reload</button></div>`;
  const s1 = document.getElementById('supabase-loading'); if(s1) s1.remove();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}
</script>
</body>
</html>
